name: Keep ActionVault Supabase Active

on:
  schedule:
    # Supabase free projects pause after inactivity; touch the DB every 3 days.
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API keepalive endpoint
        run: |
          curl --fail --show-error --silent --max-time 45 \
            https://action-vault.onrender.com/keepalive
